# Un seul service : PAS de conteneur MySQL ici.
# La base de données, c'est le MariaDB/MySQL déjà installé sur le PC.
services:
  app:
    build: .
    ports:
      - "8091:80"
    volumes:
      - ./src:/var/www/html
    extra_hosts:
      # Crée le nom "host.docker.internal" dans le conteneur,
      # qui pointe vers le PC hôte (la passerelle docker0 : 172.17.0.1)
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: host.docker.internal   # ⚠️ PAS 127.0.0.1 : dans le conteneur, 127.0.0.1 = le conteneur lui-même
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
